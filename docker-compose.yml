# Local development with Docker Compose
# Usage: docker compose up --build
#
# Prerequisites:
#   cp .env.example .env  # fill in real values
#
# Services started:
#   kiosk-frontend  http://localhost:3000
#   api-server      http://localhost:4000
#   master-mcp      http://localhost:5000/mcp
#   business-mcp    http://localhost:5001/mcp/business/:slug

version: "3.9"

x-build-base: &build-base
  context: .
  args:
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    NEXT_PUBLIC_API_URL: http://localhost:4000

services:
  kiosk-frontend:
    build:
      <<: *build-base
      dockerfile: docker/Dockerfile.kiosk-frontend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api-server
    restart: unless-stopped

  api-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-server
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  master-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.master-mcp
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  business-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.business-mcp
    ports:
      - "5001:5001"
    environment:
      PORT: "5001"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
