name: Format Journal Client Component

on:
  push:
    branches: [feature/internal-admin-foundation]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/internal-admin-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Format Journal client component
        run: pnpm prettier --write "artifacts/kiosk-frontend/src/app/journal/JournalPageClient.tsx"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Journal client component is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "artifacts/kiosk-frontend/src/app/journal/JournalPageClient.tsx"
          git commit -m "chore: format journal client component"
          git push origin HEAD:feature/internal-admin-foundation
