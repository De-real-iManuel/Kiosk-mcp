name: Format Internal Admin Branch

on:
  push:
    branches: [feature/internal-admin-foundation]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/internal-admin-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Format implementation files
        run: |
          pnpm prettier --write \
            "lib/db/src/db.ts" \
            "lib/db/src/index.ts" \
            "lib/db/src/lib/mcp-telemetry.ts" \
            "lib/db/src/lib/mcp-telemetry.test.ts" \
            "lib/db/src/schema/admin.ts" \
            "lib/db/src/schema/mcp-telemetry.ts" \
            "lib/db/src/schema/admin-telemetry.test.ts" \
            "lib/db/src/schema/telemetry.integration.test.ts" \
            "artifacts/api-server/src/lib/admin-token.ts" \
            "artifacts/api-server/src/middlewares/require-admin.ts" \
            "artifacts/api-server/src/routes/admin.ts" \
            "artifacts/api-server/src/__tests__/admin-token.test.ts" \
            "artifacts/api-server/src/__tests__/admin-middleware.test.ts" \
            "artifacts/kiosk-frontend/src/components/internal-admin/InternalAdminDashboard.tsx" \
            "artifacts/kiosk-frontend/src/app/internal-admin/page.tsx" \
            "artifacts/master-mcp/src/app.ts" \
            "artifacts/master-mcp/src/server.ts" \
            "artifacts/business-mcp/src/app.ts"
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "All implementation files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "lib/db/src/db.ts" \
            "lib/db/src/index.ts" \
            "lib/db/src/lib/mcp-telemetry.ts" \
            "lib/db/src/lib/mcp-telemetry.test.ts" \
            "lib/db/src/schema/admin.ts" \
            "lib/db/src/schema/mcp-telemetry.ts" \
            "lib/db/src/schema/admin-telemetry.test.ts" \
            "lib/db/src/schema/telemetry.integration.test.ts" \
            "artifacts/api-server/src/lib/admin-token.ts" \
            "artifacts/api-server/src/middlewares/require-admin.ts" \
            "artifacts/api-server/src/routes/admin.ts" \
            "artifacts/api-server/src/__tests__/admin-token.test.ts" \
            "artifacts/api-server/src/__tests__/admin-middleware.test.ts" \
            "artifacts/kiosk-frontend/src/components/internal-admin/InternalAdminDashboard.tsx" \
            "artifacts/kiosk-frontend/src/app/internal-admin/page.tsx" \
            "artifacts/master-mcp/src/app.ts" \
            "artifacts/master-mcp/src/server.ts" \
            "artifacts/business-mcp/src/app.ts"
          git commit -m "chore: format internal admin implementation"
          git push origin HEAD:feature/internal-admin-foundation
